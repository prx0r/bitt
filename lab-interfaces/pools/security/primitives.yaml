# Security Primitives — Canonical Registry
# Auto-imported from email research (2026-09-01)
# Each primitive is a reusable Lab component, not a bespoke agent.

# ─── WORLD + EVALUATOR ──────────────────────────────────────────────

bountybench:
  id: bountybench
  kind: WORLD
  upstream_repo: https://github.com/EnvCommons/BountyBench
    upstream_commit: "5aa4bb337f830bdcd0cb96806eda51f492df5189"
  license: MIT
  school: code-audit
  description: >
    46 real bug bounties across 31 systems. 138 tasks in 3 phases:
    detect, exploit, patch. Containerized targets with hidden verify
    scripts. Almost exactly the CP2 near-transfer benchmark we'd build.
  capability_tags: [vulnerability-detection, exploitation, patching, bug-bounty]
  supported_languages: [solidity, javascript, typescript, python, go, rust]
  input_schema: { repo: str, scope: str, budget: float }
  output_schema: { findings: list[Finding], exploit: str, patch: str }
  contamination_tier: PUBLIC_DEV
  lab_role: WORLD + EVALUATOR
  priority: P0
  cp2_role: >
    Primary CP2 near-transfer world. Use public tasks as DEV.
    Maintain private/new-disclosure holdout for SEALED evaluation.
  transfer_from_bitsec: 0.85

scabench:
  id: scabench
  kind: WORLD
  upstream_repo: https://github.com/scabench-org/scabench
    upstream_commit: "local-subnet-sn60"
  license: MIT
  school: code-audit
  description: >
    Smart-contract audit benchmark. Use official scoring/tooling,
    not our approximate title/Jaccard scorer.
  capability_tags: [smart-contract-audit, solidity, vulnerability-detection]
  supported_languages: [solidity, vyper]
  input_schema: { contract: str, compiler: str }
  output_schema: { findings: list[Finding], score: float }
  contamination_tier: PUBLIC_TRAIN
  lab_role: WORLD + EVALUATOR
  priority: P0
  transfer_from_bitsec: 1.0

# ─── PROCESS ─────────────────────────────────────────────────────────

hound:
  id: hound
  kind: PROCESS
  upstream_repo: https://github.com/scabench-org/hound
    upstream_commit: "0abbd1b11fdafc972a5ca2c38da292681af93ca9"
  license: MIT
  school: code-audit
  description: >
    Graph-driven long-horizon auditing. Scout/strategist model separation,
    persistent hypotheses, sweep vs intuition modes, coverage tracking,
    exact code retrieval. Reports large recall improvement on ScaBench subset.
    Our miner_v4 reimplemented parts of this — wrap Hound itself instead.
  capability_tags: [graph-auditing, hypothesis-tracking, code-retrieval]
  supported_languages: [solidity, any]
  input_schema: { repo: str, mode: "sweep" | "intuition" }
  output_schema: { findings: list[Finding], graph: KnowledgeGraph, coverage: float }
  contamination_tier: PUBLIC_DEV
  lab_role: PROCESS
  priority: P0
  process_version: "hound@latest"
  notes: >
    Don't partially reimplement. Create ProcessVersion: hound@<commit>.
    CG compares: current-moltwork vs hound vs hybrid.

cloudflare-audit-skill:
  id: cloudflare-audit-skill
  kind: PROCESS
  upstream_repo: https://github.com/cloudflare/security-audit-skill
    upstream_commit: "8bac42001ddd90a4dcd8d5a5045199283a8eba75"
  license: Apache-2.0
  school: code-audit
  description: >
    Six-phase workflow: recon, parallel hunting, independent adversarial
    validation, reporting, structured findings.json, fresh independent
    verification. Finder cannot validate own finding — maps to CG separation.
  capability_tags: [multi-phase-audit, adversarial-validation, parallel-hunting]
  supported_languages: [any]
  input_schema: { repo: str, scope: str }
  output_schema: { findings: list[Finding], report: str }
  contamination_tier: PUBLIC_DEV
  lab_role: PROCESS
  priority: P0
  process_version: "cloudflare-audit@latest"
  notes: >
    Test: security-01/v0 vs security-01/v0+cloudflare-audit-process
    before inventing more prompt architecture.

google-mantis:
  id: google-mantis
  kind: PROCESS
  upstream_repo: https://github.com/google/mantis
    upstream_commit: "27467b3e293897602585c5180fa5609f579b0011"
